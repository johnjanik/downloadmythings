name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, with the release it belongs to alongside
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks (syntax, missing files, remote resources)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build both browsers
        run: npm run package

      - name: Lint the Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/firefox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-builds
          path: dist/*.zip
          if-no-files-found: error
