name: Release

# Push a tag to publish a GitHub release:   git tag v1.2.3 && git push origin v1.2.3
# The tag must match the version in package.json and point at a commit on main.
# Store submission (Chrome Web Store, Firefox Add-ons, Edge Add-ons) is not
# automated yet; upload the ZIPs from the release by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the tag can be checked against main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json and be on main
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Checks and tests
        run: |
          npm run check
          npm test

      - name: Build both browsers
        run: npm run package

      - name: Lint the Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/firefox

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
