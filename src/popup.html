<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      width: 275px;
      padding: 8px;
      font-family: var(--font-ui);
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 0;
      max-height: 600px;
      overflow-y: auto;
    }
    h2 {
      margin-top: 0;
      color: var(--text-color);
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      border: none;
      border-radius: var(--radius-control);
      background: var(--primary-color);
      color: var(--on-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button:disabled {
      background: var(--disabled-bg);
      cursor: not-allowed;
      color: var(--disabled-text);
    }
    #browseConversations {
      background: var(--secondary-color);
      color: var(--text-color);
      border: var(--hairline) solid var(--border-color);
      margin-top: 6px;
    }
    #browseConversations:hover {
      background: var(--secondary-hover);
    }
    .status {
      margin: 6px 0;
      padding: 8px;
      border-radius: var(--radius-control);
      font-size: 12px;
    }
    .success {
      background: var(--success-bg);
      color: var(--success-text);
    }
    .error {
      background: var(--error-bg);
      color: var(--error-text);
    }
    .info {
      background: var(--info-bg);
      color: var(--info-text);
    }
    .info a {
      color: var(--link-color);
    }
    .options {
      margin: 8px 0;
    }
    label {
      display: block;
      margin: 6px;
      font-size: 12px;
      color: var(--text-color);
    }
    input[type="checkbox"] {
      margin-right: 5px;
    }
    select {
      width: 100%;
      padding: 4px;
      margin-top: 3px;
      border: var(--hairline) solid var(--input-border);
      border-radius: 8px;
      background-color: var(--secondary-color);
      color: var(--text-color);
      font-size: 12px;
    }
    #popup-header {
      margin: -8px -8px 8px -8px;
      padding: 14px 16px;
      background: var(--glow), var(--ground-gradient);
      border-bottom: var(--hairline) solid rgba(255, 255, 255, 0.10);
      text-align: center;
    }
    #header-title {
      color: var(--header-text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    #header-version {
      color: var(--pz-mint);
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div id="popup-header">
    <div id="header-title">DownloadMyThings</div>
    <div id="header-version"></div>
  </div>
  <div style="padding: 0 5px;">
    <div class="options">
    <!-- Chat Export Options -->
    <div class="export-row">
      <label>
        Chat format:
        <select id="format">
          <option value="json">JSON</option>
          <option value="markdown">Markdown</option>
          <option value="text">Plain Text</option>
          <option value="pdf">PDF (print)</option>
        </select>
      </label>

      <label title="Include the conversation messages in the exported file">
        <input type="checkbox" id="includeChats" checked>
        Chats
      </label>

      <label title="Include extended thinking blocks in the exported conversation">
        <input type="checkbox" id="includeThinking">
        Extended Thinking
      </label>

      <label title="Add conversation metadata (name, date, model, etc.) at the top of exported files">
        <input type="checkbox" id="includeMetadata">
        Metadata
      </label>

      <label title="Save uploaded files and pasted content as separate files. The export becomes a ZIP.">
        <input type="checkbox" id="includeAttachments">
        Attachments
      </label>
    </div>

    <!-- Artifact Export Options -->
    <div class="export-row" style="margin-top: 12px;">
      <label>
        Artifact format:
        <select id="artifactFormat">
          <option value="original">Original</option>
          <option value="markdown">Markdown</option>
          <option value="text">Plain Text</option>
          <option value="json">JSON</option>
        </select>
      </label>

      <label title="Include artifacts (code, documents, etc.) directly within the conversation text">
        <input type="checkbox" id="includeArtifacts">
        Inline Artifacts
      </label>

      <label title="Extract artifacts as separate files in nested folders">
        <input type="checkbox" id="extractArtifacts">
        Nested Artifacts
      </label>

      <label title="Flatten artifact structure (no subfolders, with conversation name prefix)">
        <input type="checkbox" id="flattenArtifacts">
        Flat Artifacts
      </label>
    </div>
  </div>

  <button id="exportCurrent">Export Current Conversation</button>
  <button id="exportAll">Export All Conversations</button>

  <button id="browseConversations">Browse All Conversations</button>
  
  <div id="status"></div>
  </div>

  <script src="theme.js"></script>
  <script src="lib/utils.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
